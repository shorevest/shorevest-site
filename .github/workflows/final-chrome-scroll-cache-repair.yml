name: Final Chrome scroll cache repair
on:
  push:
    paths:
      - '.github/workflows/final-chrome-scroll-cache-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale runtime injection and refresh all scroll assets
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()
          replacements = {
              'assets/css/homepage-rebuild.css?v=20260730-root-scroll-9': 'assets/css/homepage-rebuild.css?v=20260730-scroll-recovery-10',
              'assets/js/favicon-guard.js?v=20260729-visual-review-3': 'assets/js/favicon-guard.js?v=20260730-scroll-recovery-10',
              '/assets/css/visual-review-overrides.css?v=20260730-root-scroll-9': '/assets/css/visual-review-overrides.css?v=20260730-scroll-recovery-10',
              'assets/js/sv-navigation.js?v=20260730-native-chrome-scroll-8': 'assets/js/sv-navigation.js?v=20260730-scroll-recovery-10',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          index.write_text(s)

          guard = Path('assets/js/favicon-guard.js')
          g = guard.read_text()
          g = g.replace('var VERSION = "20260729-visual-review-3";', 'var VERSION = "20260730-scroll-recovery-10";')
          g = g.replace("document.querySelector('link[data-sv-visual-review=\"true\"]')", "document.querySelector('link[data-sv-visual-review]')")
          guard.write_text(g)
          PY
          rm -f .github/workflows/final-chrome-scroll-cache-repair.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html assets/js/favicon-guard.js .github/workflows/final-chrome-scroll-cache-repair.yml
          git commit -m "Eliminate stale Chrome scroll assets and duplicate CSS injection"
          git push
