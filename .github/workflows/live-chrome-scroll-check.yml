name: Live Chrome scroll verification
on:
  push:
    paths:
      - '.github/workflows/live-chrome-scroll-check.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install playwright-core
      - name: Test live homepage in Chrome
        run: |
          CHROME=$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser)
          export CHROME
          node <<'JS'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ executablePath: process.env.CHROME, headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const consoleErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            await page.goto('https://shorevest.com/?live-scroll-check=12', { waitUntil: 'networkidle', timeout: 60000 });
            await page.evaluate(() => window.scrollTo(0, 0));
            const before = await page.evaluate(() => ({
              y: window.scrollY,
              max: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) - window.innerHeight,
              rootOverflowY: getComputedStyle(document.documentElement).overflowY,
              bodyOverflowY: getComputedStyle(document.body).overflowY,
              bodyPosition: getComputedStyle(document.body).position,
              guardLoaded: !!document.querySelector('script[src*="chrome-scroll-guard.js"]')
            }));
            await page.mouse.move(600, 400);
            await page.mouse.wheel(0, 700);
            await page.waitForTimeout(700);
            const afterWheel = await page.evaluate(() => window.scrollY);
            await page.evaluate(() => {
              document.documentElement.style.cssText = 'height:100%!important;overflow:hidden!important';
              document.body.style.cssText = 'height:100%!important;overflow:hidden!important;position:fixed!important;inset:0!important';
            });
            await page.waitForTimeout(250);
            const recoveredStyles = await page.evaluate(() => ({
              rootOverflowY: getComputedStyle(document.documentElement).overflowY,
              bodyOverflowY: getComputedStyle(document.body).overflowY,
              bodyPosition: getComputedStyle(document.body).position
            }));
            await page.mouse.wheel(0, 400);
            await page.waitForTimeout(700);
            const afterRelockWheel = await page.evaluate(() => window.scrollY);
            const result = {
              checkedAt: new Date().toISOString(),
              url: page.url(),
              userAgent: await page.evaluate(() => navigator.userAgent),
              before,
              afterWheel,
              recoveredStyles,
              afterRelockWheel,
              passed: before.guardLoaded && before.max > 0 && afterWheel > 0 && afterRelockWheel > afterWheel && recoveredStyles.rootOverflowY !== 'hidden' && recoveredStyles.bodyPosition !== 'fixed',
              consoleErrors
            };
            fs.writeFileSync('chrome-scroll-live-result.json', JSON.stringify(result, null, 2) + '\n');
            await browser.close();
            if (!result.passed) process.exitCode = 1;
          })().catch(error => {
            fs.writeFileSync('chrome-scroll-live-result.json', JSON.stringify({ passed: false, error: String(error && error.stack || error) }, null, 2) + '\n');
            process.exitCode = 1;
          });
          JS
      - name: Publish measured result
        if: always()
        run: |
          rm -f .github/workflows/live-chrome-scroll-check.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Record live Chrome scroll verification"
          git push