name: Verify live Chrome scrolling
on:
  push:
    paths:
      - '.github/workflows/verify-live-chrome-scroll.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Test live homepage scrolling in Chromium
        run: |
          cat > /tmp/test-scroll.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({viewport: {width: 1440, height: 900}});
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            const url = 'https://shorevest.com/?chrome-scroll-verification=20260730-11';
            const response = await page.goto(url, {waitUntil: 'networkidle', timeout: 90000});
            await page.waitForTimeout(1500);
            const before = await page.evaluate(() => ({
              scrollY: window.scrollY,
              scrollTop: document.scrollingElement?.scrollTop ?? null,
              scrollingElement: document.scrollingElement?.tagName ?? null,
              innerHeight: window.innerHeight,
              htmlScrollHeight: document.documentElement.scrollHeight,
              bodyScrollHeight: document.body.scrollHeight,
              htmlOverflow: getComputedStyle(document.documentElement).overflow,
              htmlOverflowX: getComputedStyle(document.documentElement).overflowX,
              htmlOverflowY: getComputedStyle(document.documentElement).overflowY,
              bodyOverflow: getComputedStyle(document.body).overflow,
              bodyOverflowX: getComputedStyle(document.body).overflowX,
              bodyOverflowY: getComputedStyle(document.body).overflowY,
              bodyPosition: getComputedStyle(document.body).position,
              bodyHeight: getComputedStyle(document.body).height,
              unlockStylePresent: !!document.getElementById('sv-root-scroll-unlock'),
              unlockScriptPresent: !!document.getElementById('sv-root-scroll-unlock-script'),
              css: [...document.querySelectorAll('link[rel="stylesheet"]')].map(x => x.href),
              scripts: [...document.scripts].map(x => x.src).filter(Boolean)
            }));
            await page.mouse.move(720, 450);
            await page.mouse.wheel(0, 700);
            await page.waitForTimeout(1200);
            const afterWheel = await page.evaluate(() => ({
              scrollY: window.scrollY,
              scrollTop: document.scrollingElement?.scrollTop ?? null
            }));
            await page.keyboard.press('PageDown');
            await page.waitForTimeout(900);
            const afterPageDown = await page.evaluate(() => ({
              scrollY: window.scrollY,
              scrollTop: document.scrollingElement?.scrollTop ?? null
            }));
            const passed = afterWheel.scrollY > 0 && afterPageDown.scrollY > afterWheel.scrollY;
            const report = {
              testedAt: new Date().toISOString(),
              url: page.url(),
              status: response ? response.status() : null,
              userAgent: await page.evaluate(() => navigator.userAgent),
              before,
              afterWheel,
              afterPageDown,
              errors,
              passed
            };
            fs.writeFileSync('chrome-scroll-live-report.json', JSON.stringify(report, null, 2) + '\n');
            await page.screenshot({path: 'chrome-scroll-live-screenshot.png', fullPage: false});
            console.log(JSON.stringify(report, null, 2));
            await browser.close();
          })().catch(err => {
            const report = {testedAt: new Date().toISOString(), passed: false, fatalError: String(err), stack: err.stack};
            fs.writeFileSync('chrome-scroll-live-report.json', JSON.stringify(report, null, 2) + '\n');
            console.error(err);
          });
          JS
          node /tmp/test-scroll.js
      - name: Commit verification report
        run: |
          rm -f .github/workflows/verify-live-chrome-scroll.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add chrome-scroll-live-report.json chrome-scroll-live-screenshot.png .github/workflows/verify-live-chrome-scroll.yml
          git commit -m "Verify live homepage scrolling in Chromium"
          git push
