name: Import previous homepage hero

on:
  push:
    paths:
      - '.github/workflows/copy-previous-home-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved previous homepage hero
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/shorevest/website/7dd8b1963dec06da4933c84f6d20e76cc0f90e31/max-zhang-n49ciNUwej8-unsplash.jpg'
          curl --fail --location --retry 3 --output max-zhang-n49ciNUwej8-unsplash.jpg "$url"
          test -s max-zhang-n49ciNUwej8-unsplash.jpg
          python - <<'PY'
          from pathlib import Path
          p = Path('max-zhang-n49ciNUwej8-unsplash.jpg')
          data = p.read_bytes()
          if not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Downloaded file is not a JPEG')
          if len(data) < 100_000:
              raise SystemExit('Downloaded image is unexpectedly small')
          print(f'Validated JPEG: {len(data):,} bytes')
          PY

      - name: Commit image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add max-zhang-n49ciNUwej8-unsplash.jpg
          if git diff --cached --quiet; then
            echo 'Image already present and unchanged.'
            exit 0
          fi
          git commit -m 'Add previous homepage hero image for Strategy'
          git push
