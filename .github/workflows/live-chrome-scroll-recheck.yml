name: Recheck live Chrome scroll
on:
  push:
    paths:
      - '.github/workflows/live-chrome-scroll-recheck.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install playwright-core
      - name: Recheck public homepage
        run: |
          CHROME=$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser)
          export CHROME
          node <<'JS'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ executablePath: process.env.CHROME, headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            await page.goto('https://shorevest.com/?live-scroll-recheck=13', { waitUntil: 'networkidle', timeout: 60000 });
            const assets = await page.evaluate(() => ({
              scripts: Array.from(document.scripts).map(s => s.src).filter(Boolean),
              styles: Array.from(document.querySelectorAll('link[rel="stylesheet"]')).map(l => l.href)
            }));
            await page.evaluate(() => window.scrollTo(0, 0));
            const before = await page.evaluate(() => ({
              y: scrollY,
              max: Math.max(document.documentElement.scrollHeight, document.body.scrollHeight) - innerHeight,
              rootOverflowY: getComputedStyle(document.documentElement).overflowY,
              bodyOverflowY: getComputedStyle(document.body).overflowY,
              bodyPosition: getComputedStyle(document.body).position,
              guardLoaded: !!document.querySelector('script[src*="chrome-scroll-guard.js"]')
            }));
            await page.mouse.move(600, 400);
            await page.mouse.wheel(0, 700);
            await page.waitForTimeout(700);
            const afterWheel = await page.evaluate(() => scrollY);
            const result = { checkedAt: new Date().toISOString(), url: page.url(), before, afterWheel, assets, passed: before.guardLoaded && before.max > 0 && afterWheel > 0 };
            fs.writeFileSync('chrome-scroll-live-result-2.json', JSON.stringify(result, null, 2) + '\n');
            await browser.close();
            if (!result.passed) process.exitCode = 1;
          })().catch(e => { fs.writeFileSync('chrome-scroll-live-result-2.json', JSON.stringify({passed:false,error:String(e&&e.stack||e)},null,2)+'\n'); process.exitCode=1; });
          JS
      - name: Publish result
        if: always()
        run: |
          rm -f .github/workflows/live-chrome-scroll-recheck.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Record second live Chrome scroll verification"
          git push