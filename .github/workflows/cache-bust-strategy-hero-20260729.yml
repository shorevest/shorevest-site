name: Cache bust Strategy hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-strategy-hero-20260729.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Strategy stylesheet version
        shell: bash
        run: |
          sed -i 's|assets/css/strategy-rebuild.css?v=20260717-mobile-polish|assets/css/strategy-rebuild.css?v=20260729-former-home-hero|' strategy/index.html
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy/index.html
          git commit -m "Cache bust Strategy hero image update"
          git push
