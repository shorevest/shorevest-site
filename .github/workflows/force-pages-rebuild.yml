name: Force GitHub Pages rebuild

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-pages-rebuild.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request fresh GitHub Pages build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages-build.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GH_REPOSITORY}/pages/builds")
          cat /tmp/pages-build.json || true
          echo "HTTP ${code}"
          test "${code}" = "201"
