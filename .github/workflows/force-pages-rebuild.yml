name: Final repository structure cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-pages-rebuild.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Consolidate Strategy assets and remove stale code
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          visual = Path('assets/css/visual-review-overrides.css')
          text = visual.read_text(encoding='utf-8')
          old = 'url("/yang-miao-YUJNtZS8n5o-unsplash.jpg")'
          new = 'url("/assets/img/strategy/yang-miao-YUJNtZS8n5o-unsplash.jpg")'
          if old not in text:
              raise SystemExit('Expected current Yang Miao Strategy reference not found')
          visual.write_text(text.replace(old, new, 1), encoding='utf-8')

          strategy = Path('assets/css/strategy-rebuild.css')
          text = strategy.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\n?/\* 2026-07-29 · Use the former homepage hero image for the Strategy hero and keep it in colour\. \*/\n'
              r'body\.strategy-page \.sx-hero__panel \{.*?'
              r'body\.strategy-page \.sx-hero__media:hover \.sx-hero__panel \{\n'
              r'  filter: none !important;\n'
              r'\}\s*\Z',
              re.S,
          )
          cleaned, count = pattern.subn('\n', text)
          if count != 1:
              raise SystemExit(f'Expected one stale Max Zhang Strategy block, found {count}')
          strategy.write_text(cleaned.rstrip() + '\n', encoding='utf-8')

          ignore = Path('.gitignore')
          text = ignore.read_text(encoding='utf-8')
          additions = [
              '/chrome-scroll-live-report.json',
              '/chrome-scroll-live-screenshot.png',
          ]
          for line in additions:
              if line not in text.splitlines():
                  text += line + '\n'
          ignore.write_text(text, encoding='utf-8')
          PY

          mkdir -p assets/img/strategy
          git mv yang-miao-YUJNtZS8n5o-unsplash.jpg assets/img/strategy/yang-miao-YUJNtZS8n5o-unsplash.jpg
          git rm max-zhang-n49ciNUwej8-unsplash.jpg
          rm .github/workflows/force-pages-rebuild.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore assets/css/visual-review-overrides.css assets/css/strategy-rebuild.css assets/img/strategy/yang-miao-YUJNtZS8n5o-unsplash.jpg .github/workflows/force-pages-rebuild.yml
          git commit -m 'Consolidate Strategy assets and remove stale CSS'
          git push origin HEAD:main
