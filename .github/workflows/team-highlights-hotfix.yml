name: One-time team highlights hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/team-highlights-hotfix.yml"

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event.head_commit.message == 'Add one-time team highlights hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update team highlight copy and bust JS cache
        shell: python
        run: |
          from pathlib import Path
          import re

          replacements = {
              Path('team/index.html'): (
                  '''              <article>\n                <p>Offices across Greater China</p>\n                <span>4</span>\n              </article>\n              <article>\n                <p>Investment Committee members</p>\n                <span>4</span>\n              </article>''',
                  '''              <article>\n                <p>Located in</p>\n                <span>Guangzhou, Shanghai, Beijing and Shenzhen</span>\n              </article>'''
              ),
              Path('cn/team/index.html'): (
                  '''              <article>\n                <p>大中华区办公室</p>\n                <span>4</span>\n              </article>\n              <article>\n                <p>投资委员会成员</p>\n                <span>4</span>\n              </article>''',
                  '''              <article>\n                <p>位于</p>\n                <span>广州、上海、北京及深圳</span>\n              </article>'''
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected highlight block not found in {path}')
              text = text.replace(old, new, 1)
              text = re.sub(
                  r'assets/js/team-page\.js\?v=[^"\']+',
                  'assets/js/team-page.js?v=20260805-location-fix',
                  text,
              )
              path.write_text(text, encoding='utf-8')

      - name: Commit direct HTML fix
        run: |
          git config user.name "shorevest-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add team/index.html cn/team/index.html
          git commit -m "Fix team platform highlights directly"
          git push
