name: Bump final navigation cache
on:
  push:
    paths:
      - '.github/workflows/bump-final-navigation-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh final homepage runtime URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text().replace(
              'assets/js/sv-navigation.js?v=20260730-root-scroll-9',
              'assets/js/sv-navigation.js?v=20260730-scroll-recovery-10'
          )
          p.write_text(s)
          PY
          rm -f .github/workflows/bump-final-navigation-cache.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html .github/workflows/bump-final-navigation-cache.yml
          git commit -m "Refresh final Chrome navigation runtime"
          git push
