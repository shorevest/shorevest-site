name: Deploy tested Chrome scroll guard
on:
  push:
    paths:
      - '.github/workflows/deploy-runtime-scroll-guard.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime guard on homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<script src="/assets/js/chrome-scroll-guard.js?v=20260730-runtime-scroll-11" defer></script>'
          if tag not in s:
              marker = '<script src="assets/js/favicon-guard.js?v=20260730-scroll-recovery-10" defer></script>'
              if marker in s:
                  s = s.replace(marker, tag + '\n' + marker)
              else:
                  s = s.replace('</head>', tag + '\n</head>')
          p.write_text(s)
          PY
          rm -f .github/workflows/verify-live-chrome-scroll.yml
          rm -f .github/workflows/deploy-runtime-scroll-guard.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Install tested Chrome runtime scroll guard"
          git push