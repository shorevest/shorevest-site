name: One-time Pages diagnose

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-diagnose.yml"

permissions:
  contents: write
  pages: write

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Add one-time Pages diagnose'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose GitHub Pages configuration and live DNS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/pages" > pages-diagnose.json
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/pages/builds/latest" > pages-latest-build.json
          {
            echo 'shorevest.com A:'
            dig +short shorevest.com A || true
            echo 'www.shorevest.com CNAME:'
            dig +short www.shorevest.com CNAME || true
            echo 'shorevest.github.io A:'
            dig +short shorevest.github.io A || true
          } > pages-dns.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-diagnose.json pages-latest-build.json pages-dns.txt
          git commit -m 'Record Pages diagnosis' || exit 0
          git push
