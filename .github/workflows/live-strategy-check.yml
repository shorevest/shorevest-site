name: One-time live Strategy hero check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-strategy-check.yml"

permissions:
  contents: write

jobs:
  check:
    if: github.event.head_commit.message == 'Add one-time live Strategy hero check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check live Strategy hero assets
        shell: bash
        run: |
          set -u
          sleep 20
          ts=$(date +%s)
          page_code=$(curl -L -sS -o /tmp/strategy.html -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://shorevest.com/strategy/?_livecheck=${ts}")
          css_code=$(curl -L -sS -o /tmp/strategy.css -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://shorevest.com/assets/css/visual-review-overrides.css?_livecheck=${ts}")
          image_code=$(curl -L -sS -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://shorevest.com/yang-miao-YUJNtZS8n5o-unsplash.jpg?_livecheck=${ts}")
          css_yang=no; css_max=no; page_override=no
          grep -Fq 'yang-miao-YUJNtZS8n5o-unsplash.jpg' /tmp/strategy.css && css_yang=yes || true
          grep -Fq 'max-zhang-n49ciNUwej8-unsplash.jpg' /tmp/strategy.css && css_max=yes || true
          grep -Fq 'visual-review-overrides.css' /tmp/strategy.html && page_override=yes || true
          printf 'checked_at=%s\npage_http=%s\ncss_http=%s\nimage_http=%s\ncss_yang=%s\ncss_max=%s\npage_override=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$page_code" "$css_code" "$image_code" "$css_yang" "$css_max" "$page_override" > live-strategy-check.txt
          cat live-strategy-check.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-strategy-check.txt
          git commit -m 'Record live Strategy hero check' || exit 0
          git push
