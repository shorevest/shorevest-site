name: Update strategy hero image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-strategy-hero-image.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use former homepage hero image on Strategy
        shell: bash
        run: |
          cat >> assets/css/strategy-rebuild.css <<'CSS'

          /* 2026-07-29 · Use the former homepage hero image for the Strategy hero and keep it in colour. */
          body.strategy-page .sx-hero__panel {
            filter: none !important;
            background:
              linear-gradient(180deg, rgba(24,37,36,0.04), rgba(24,37,36,0.10)),
              url("../img/trees/home-hero-metasequoia-sq.jpg") center / cover no-repeat !important;
          }
          body.strategy-page .sx-hero__media:hover .sx-hero__panel {
            filter: none !important;
          }
          CSS
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/strategy-rebuild.css
          git commit -m "Use former homepage hero image on Strategy"
          git push
