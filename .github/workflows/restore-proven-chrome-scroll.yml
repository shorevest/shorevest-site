name: Restore proven Chrome scrolling
on:
  push:
    paths:
      - '.github/workflows/restore-proven-chrome-scroll.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore earlier working homepage setup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('/assets/css/visual-review-overrides.css?v=20260730-chrome-top-6', '/assets/css/visual-review-overrides.css?v=20260730-native-scroll-restored-7')
          s = s.replace('<script src="/assets/js/top-scroll-boundary.js?v=20260730-chrome-top-6" defer></script>\n', '')
          p.write_text(s)
          PY
          rm -f assets/js/top-scroll-boundary.js
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html assets/js/top-scroll-boundary.js
          git commit -m "Restore earlier working Chrome scroll implementation"
          git push
